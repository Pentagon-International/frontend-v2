  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; gap: 6px; font-size: 11px; justify-content: flex-end; }\n.prob-bar-wrap { width: 44px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }\n.prob-bar-fill { height: 100%; background: var(--navy-600); }\n\n.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; background: var(--line); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }\n.badge.red { background: var(--bad-bg); color: #991b1b; }\n.badge.amber { background: var(--warn-bg); color: #92400e; }\n.badge.green { background: var(--good-bg); color: #166534; }\n\n.risk { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em; }\n.risk.low { background: var(--good-bg); color: #166534; }\n.risk.med { background: var(--warn-bg); color: #92400e; }\n.risk.high { background: var(--bad-bg); color: #b91c1c; }\n\n/* FUNNEL */\n.funnel { display: flex; flex-direction: column; gap: 8px; }\n.funnel-row { display: grid; grid-template-columns: 120px 1fr 90px 70px; align-items: center; gap: 12px; font-size: 12px; }\n.funnel-row .lbl { color: var(--ink-2); font-weight: 500; }\n.funnel-row .bar-wrap { height: 28px; background: var(--bg); border-radius: 6px; overflow: hidden; position: relative; }\n.funnel-row .bar { height: 100%; background: linear-gradient(90deg, var(--navy-700), var(--navy-500)); display: flex; align-items: center; padding: 0 10px; color: #fff; font-size: 11px; font-weight: 600; border-radius: 6px; }\n.funnel-row .bar.won { background: linear-gradient(90deg, #15803d, #22c55e); }\n.funnel-row .bar.lost { background: linear-gradient(90deg, #991b1b, #dc2626); }\n.funnel-row .count { text-align: right; font-weight: 600; }\n.funnel-row .rate { text-align: right; color: var(--ink-3); font-size: 11px; font-family: var(--mono); }\n\n.divider-label { display: flex; align-items: center; gap: 10px; color: var(--ink-4); font-size: 10.5px; text-transform: up  Actual', crumb:'Budget vs Actual'},\n  };\n  function go(name) {\n    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n    const el = document.getElementById('page-'+name); if (el) el.classList.add('active');\n    document.querySelectorAll('.sidebar .nav-item[data-nav]').forEach(n => n.classList.toggle('active', n.dataset.nav === name));\n    document.getElementById('crumb-page').textContent = pages[name]?.crumb || name;\n    window.scrollTo({top:0});\n    try { localStorage.setItem('pentagon.page', name); } catch(e) {}\n  }\n  document.querySelectorAll('[data-nav]').forEach(el => {\n    el.addEventListener('click', () => go(el.dataset.nav));\n  });\n  try { const saved = localStorage.getItem('pentagon.page'); if (saved && pages[saved]) go(saved); } catch(e) {}\n\n  // role switcher (in sidebar)\n  const roleLabels = {\n    rep: {h1:'My Sales', sub:'Rep view · R. Sharma · Updated 2 min ago'},\n    manager: {h1:'Sales Performance', sub:'Manager view · Team of 6 · Updated 2 min ago'},\n    leader: {h1:'Sales Leadership', sub:'Leadership view · All regions · Updated 2 min ago'},\n  };\n  function setRole(role) {\n    TWEAKS.role = role;\n    document.querySelectorAll('#role-switcher button').forEach(b => b.classList.toggle('on', b.dataset.role === role));\n    document.querySelectorAll('#seg-role button').forEach(b => b.classList.toggle('on', b.dataset.val === role));\n    const h1 = document.getElementById('h1-overview');\n    const sub = document.getElementById('sub-overview');\n    if (h1) h1.textContent = roleLabels[role].h1;\n    if (sub) sub.textContent = roleLabels[role].sub;\n    try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:{role}}, '*'); } catch(e) {}\n  }\n  document.querySelectorAll('#role-switcher button').forEach(b => b.addEventListener('click', () => setRole(b.dataset.role)));\n\n  // tweaks\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"theme\": \"navy\",\n    \"density\": \"comfortable\",\n    \"role\": \"leader\"\n  }/*EDITMODE-END*/;\n\n  function applyTweaks() {\n    document.body.classList.toggle('theme-graphite', TWEAKS.theme === 'graphite');\n    document.body.classList.toggle('compact', TWEAKS.density === 'compact');\n    document.querySelectorAll('#seg-theme button').forEach(b => b.classList.toggle('on', b.dataset.val === TWEAKS.theme));\n    document.querySelectorAll('#seg-density button').forEach(b => b.classList.toggle('on', b.dataset.val === TWEAKS.density));\n    document.querySelectorAll('#seg-role button').forEach(b => b.classList.toggle('on', b.dataset.val === TWEAKS.role));\n    document.querySelectorAll('#role-switcher button').forEach(b => b.classList.toggle('on', b.dataset.role === TWEAKS.role));\n  }\n  applyTweaks();\n  setRole(TWEAKS.role);\n\n  function setTweak(key, val) {\n    TWEAKS[key] = val;\n    applyTweaks();\n    try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[key]:val}}, '*'); } catch(e) {}\n  }\n  document.querySelectorAll('#seg-theme button').forEach(b => b.addEventListener('click', () => setTweak('theme', b.dataset.val)));\n  document.querySelectorAll('#seg-density button').forEach(b => b.addEventListener('click', () => setTweak('density', b.dataset.val)));\n  document.querySelectorAll('#seg-role button').forEach(b => b.addEventListener('click', () => setRole(b.dataset.val)));\n\n  // edit-mode host protocol\n  window.addEventListener('message', (e) => {\n    const d = e.data || {};\n    if (d.type === '__activate_edit_mode') document.getElementById('tweaks').classList.add('open');\n    if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('open');\n  });\n  try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e) {}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
