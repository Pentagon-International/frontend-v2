<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pulse — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
:root {
  --bg:       #ffffff;
  --surface:  #f8f8fc;
  --surface2: #f1f0f8;
  --border:   #e4e3f0;
  --border2:  #d0cfea;
  --accent:   #7c3aed;
  --accent2:  #4f46e5;
  --text:     #1a1830;
  --muted:    #8b8aaa;
  --muted2:   #5e5d7a;
  --error:    #dc2626;
  --success:  #059669;
  --warning:  #d97706;
  --sidebar-w: 272px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
}

/* ── Sidebar ──────────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width .25s ease, min-width .25s ease, opacity .2s;
  overflow: hidden;
  flex-shrink: 0;
}
.sidebar.collapsed { width: 0; min-width: 0; opacity: 0; }

.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.logo-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; flex-shrink: 0;
}
.logo-text {
  font-family: 'DM Serif Display', serif;
  font-size: 1rem;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.new-btn {
  width: 100%;
  padding: 9px 14px;
  border-radius: 9px;
  border: 1px dashed var(--border2);
  background: transparent;
  color: var(--muted2);
  font-family: 'DM Sans', sans-serif;
  font-size: .82rem;
  cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: border-color .15s, color .15s, background .15s;
  white-space: nowrap;
}
.new-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(124,58,237,.06);
}

.sessions-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px;
}
.sessions-wrap::-webkit-scrollbar { width: 4px; }
.sessions-wrap::-webkit-scrollbar-track { background: transparent; }
.sessions-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.section-label {
  font-size: .65rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 8px 4px;
}

.session-item {
  position: relative;
  display: flex; align-items: center; gap: 0;
  padding: 8px 10px;
  border-radius: 9px;
  cursor: pointer;
  transition: background .12s;
  margin-bottom: 1px;
  min-height: 52px;
}
.session-item:hover { background: var(--surface2); }
.session-item.active {
  background: rgba(124,58,237,.08);
  border: 1px solid rgba(124,58,237,.18);
}
.session-item .session-body { flex: 1; min-width: 0; }
.session-title-text {
  font-size: .83rem;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.session-item.active .session-title-text { color: var(--accent); }
.session-preview {
  font-size: .72rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}
.session-time {
  font-size: .65rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
  margin-top: 2px;
}
.session-actions {
  display: none;
  gap: 4px;
  flex-shrink: 0;
}
.session-item:hover .session-actions,
.session-item.active .session-actions { display: flex; }
.sess-act-btn {
  width: 24px; height: 24px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem;
  transition: background .12s, color .12s;
}
.sess-act-btn:hover { background: var(--border2); color: var(--text); }
.sess-act-btn.del:hover { background: rgba(220,38,38,.1); color: var(--error); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.user-row {
  display: flex; align-items: center; gap: 8px;
}
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-email {
  font-size: .72rem;
  font-family: 'DM Mono', monospace;
  color: var(--muted2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-role {
  font-size: .62rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.logout-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: .7rem;
  font-family: 'DM Mono', monospace;
  padding: 4px 6px; border-radius: 5px;
  transition: color .12s, background .12s;
  flex-shrink: 0;
}
.logout-btn:hover { color: var(--error); background: rgba(220,38,38,.07); }

/* ── Main ────────────────────────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  min-width: 0;
}

.chat-header {
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  flex-shrink: 0;
  background: var(--surface);
}
.toggle-btn {
  width: 32px; height: 32px; border-radius: 8px;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s;
  flex-shrink: 0;
}
.toggle-btn:hover { background: var(--border); color: var(--text); }

.header-title {
  flex: 1;
  font-size: .9rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.header-title:hover { color: var(--accent); }
.header-title.editing {
  background: none;
  border: none;
  border-bottom: 1px solid var(--accent);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .9rem;
  font-weight: 500;
  outline: none;
  padding: 2px 0;
}

.status-pill {
  font-size: .68rem;
  font-family: 'DM Mono', monospace;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--border);
  color: var(--muted);
  display: flex; align-items: center; gap: 5px;
  flex-shrink: 0;
  transition: all .2s;
}
.status-pill.working {
  background: rgba(124,58,237,.08);
  color: var(--accent);
  border: 1px solid rgba(124,58,237,.2);
}
.status-pill.working::before {
  content: '';
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  animation: pulse 1s ease-in-out infinite;
}
.status-pill.error { background: rgba(220,38,38,.08);  color: var(--error); }
.status-pill.idle  { background: rgba(5,150,105,.08);  color: var(--success); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Messages ──────────────────────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.msg-row {
  display: flex;
  padding: 6px 24px;
  gap: 12px;
  max-width: 100%;
}
.msg-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.msg-avatar.user-av {
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  color: #fff;
}
.msg-avatar.ai-av {
  background: linear-gradient(135deg, #ede9fe, #e0e7ff);
  border: 1px solid var(--border2);
  color: var(--accent);
  font-size: .85rem;
}

.msg-bubble-wrap { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
.msg-row.user .msg-bubble-wrap { align-items: flex-end; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: .875rem;
  line-height: 1.6;
  max-width: 100%;
  word-break: break-word;
}
.msg-bubble.user-bubble {
  background: linear-gradient(135deg, rgba(124,58,237,.1), rgba(79,70,229,.1));
  border: 1px solid rgba(124,58,237,.18);
  border-bottom-right-radius: 4px;
  color: var(--text);
}
.msg-bubble.ai-bubble {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

/* Markdown inside bubbles */
.msg-bubble p { margin-bottom: .6em; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3 {
  font-family: 'DM Serif Display', serif;
  margin: .8em 0 .4em;
}
.msg-bubble code {
  background: rgba(124,58,237,.07);
  border: 1px solid rgba(124,58,237,.14);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: 'DM Mono', monospace;
  font-size: .82em;
  color: var(--accent);
}
.msg-bubble pre {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: .6em 0;
}
.msg-bubble pre code {
  background: none; border: none; padding: 0;
  color: var(--muted2); font-size: .82rem;
}
.msg-bubble ul, .msg-bubble ol { padding-left: 1.4em; margin-bottom: .6em; }
.msg-bubble li { margin-bottom: .2em; }
.msg-bubble a { color: var(--accent); }
.msg-bubble strong { font-weight: 600; }
.msg-bubble blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 12px;
  color: var(--muted2);
  margin: .4em 0;
}
.msg-bubble table { width: 100%; border-collapse: collapse; margin: .6em 0; font-size: .82rem; }
.msg-bubble th {
  background: rgba(124,58,237,.06);
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border2);
  font-family: 'DM Mono', monospace;
  font-size: .72rem;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--muted2);
}
.msg-bubble td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
  font-size: .82rem;
}
.msg-bubble tr:last-child td { border-bottom: none; }
.msg-bubble tr:hover td { background: rgba(0,0,0,.02); }

/* Tool status cards */
.tool-card {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-size: .78rem;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 4px;
}
.tool-card.running  { border-color: rgba(251,191,36,.25);  background: rgba(251,191,36,.04); }
.tool-card.success  { border-color: rgba(52,211,153,.25);  background: rgba(52,211,153,.04); }
.tool-card.error    { border-color: rgba(248,113,113,.25); background: rgba(248,113,113,.04); }
.tool-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.tool-dot.running { background: var(--warning); animation: pulse 1s infinite; }
.tool-dot.success { background: var(--success); }
.tool-dot.error   { background: var(--error); }
.tool-name { font-family: 'DM Mono', monospace; color: var(--muted2); }
.tool-desc { color: var(--muted); margin-left: auto; font-family: 'DM Mono', monospace; }

/* Notification banners */
.notif-banner {
  padding: 8px 12px;
  border-radius: 10px;
  font-size: .82rem;
  display: flex; align-items: flex-start; gap: 8px;
  margin-bottom: 4px;
}
.notif-banner.info    { border: 1px solid rgba(129,140,248,.25); background: rgba(129,140,248,.06); }
.notif-banner.success { border: 1px solid rgba(52,211,153,.25);  background: rgba(52,211,153,.06);  color: var(--success); }
.notif-banner.warning { border: 1px solid rgba(251,191,36,.25);  background: rgba(251,191,36,.06);  color: var(--warning); }
.notif-banner.error   { border: 1px solid rgba(248,113,113,.25); background: rgba(248,113,113,.06); color: var(--error); }

/* DataFrame table component */
.df-wrap {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--border2);
  margin: 4px 0;
  max-height: 360px;
  overflow-y: auto;
}
.df-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
.df-wrap::-webkit-scrollbar-track { background: transparent; }
.df-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
.df-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.df-table th {
  background: rgba(124,58,237,.06);
  padding: 7px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border2);
  font-family: 'DM Mono', monospace;
  font-size: .68rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted2);
  white-space: nowrap;
  position: sticky; top: 0;
}
.df-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
  font-size: .78rem;
  white-space: nowrap;
}
.df-table tr:last-child td { border-bottom: none; }
.df-table tr:hover td { background: rgba(0,0,0,.018); }
.df-row-count {
  font-size: .65rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  padding: 5px 10px;
  text-align: right;
  border-top: 1px solid var(--border);
}

/* Chart container */
.chart-wrap {
  border-radius: 10px;
  border: 1px solid var(--border2);
  overflow: hidden;
  margin: 4px 0;
  background: var(--surface);
  min-height: 280px;
}

/* ── Chat Loader ───────────────────────────────────────────────────────────── */
.chat-loader {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(124,58,237,.05), rgba(79,70,229,.04));
  border: 1px solid rgba(124,58,237,.16);
  border-radius: 14px;
  min-width: 220px;
  max-width: 340px;
}
.loader-top {
  display: flex; align-items: center; gap: 10px;
}
.loader-ring {
  width: 18px; height: 18px; flex-shrink: 0;
  border: 2px solid rgba(124,58,237,.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
.loader-step {
  font-size: .8rem;
  font-family: 'DM Mono', monospace;
  color: var(--muted2);
  transition: opacity .25s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}
.loader-dots {
  display: flex; gap: 5px; padding-left: 28px;
}
.loader-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent);
  opacity: .25;
  animation: dpulse 1.4s ease-in-out infinite;
}
.loader-dots span:nth-child(2) { animation-delay: .2s; }
.loader-dots span:nth-child(3) { animation-delay: .4s; }
.loader-dots span:nth-child(4) { animation-delay: .6s; }
@keyframes dpulse { 0%,80%,100%{opacity:.2;transform:scale(1)} 40%{opacity:1;transform:scale(1.4)} }

/* ── Summary label above final AI response ─────────────────────────────────── */
.summary-label {
  display: flex; align-items: center; gap: 8px;
  font-size: .62rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 6px;
}
.summary-label::after {
  content: '';
  flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(124,58,237,.3), transparent);
}

/* Typing indicator (kept for fallback) */
.typing-indicator {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 14px;
}
.typing-indicator span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  animation: bounce .8s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: .15s; }
.typing-indicator span:nth-child(3) { animation-delay: .3s;  }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }

.msg-time {
  font-size: .65rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  padding: 0 2px;
}

/* ── Empty state ──────────────────────────────────────────────────────────── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
  text-align: center;
  color: var(--muted);
}
.empty-icon {
  width: 64px; height: 64px; border-radius: 18px;
  background: linear-gradient(135deg, rgba(124,58,237,.08), rgba(79,70,229,.08));
  border: 1px solid rgba(124,58,237,.14);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
}
.empty-state h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--text);
}
.empty-state p { font-size: .85rem; max-width: 340px; line-height: 1.6; }
.suggestions {
  display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px;
}
.suggestion-btn {
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--muted2);
  text-align: left;
  cursor: pointer;
  font-size: .82rem;
  font-family: 'DM Sans', sans-serif;
  transition: border-color .15s, color .15s, background .15s;
}
.suggestion-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(124,58,237,.05);
}

/* ── Input area ────────────────────────────────────────────────────────────── */
.input-area {
  padding: 8px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.input-wrap {
  display: flex;
  align-items: baseline;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 14px;
  transition: border-color .15s, box-shadow .15s;
}
.input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124,58,237,.1);
}
.input-wrap.disabled { opacity: .5; pointer-events: none; }
textarea#msg-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .875rem;
  resize: none;
  max-height: 160px;
  min-height: 24px;
  line-height: 1.5;
}
textarea#msg-input::placeholder { color: var(--muted); }
.send-btn {
  width: 34px; height: 34px; border-radius: 9px;
  border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: .9rem;
  transition: opacity .15s, transform .1s;
}
.send-btn:hover { opacity: .85; }
.send-btn:active { transform: scale(.93); }
.send-btn:disabled { opacity: .35; cursor: not-allowed; }
.input-hint {
  font-size: .68rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  text-align: center;
  margin-top: 8px;
}

/* ── Rename inline input ───────────────────────────────────────────────────── */
.rename-input {
  background: var(--bg);
  border: 1px solid var(--accent);
  border-radius: 7px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: .78rem;
  padding: 3px 8px;
  outline: none;
  width: 100%;
}

/* ── Responsive ────────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .sidebar { position: fixed; z-index: 100; height: 100vh; left: 0; }
  .sidebar.collapsed { width: 0; min-width: 0; }
}
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-row">
      <div class="logo-icon">🧠</div>
      <div class="logo-text">Pulse</div>
    </div>
    <button class="new-btn" onclick="newSession()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New conversation
    </button>
  </div>

  <div class="sessions-wrap" id="sessions-wrap">
    <div class="section-label">Recent</div>
    <div id="session-list"><!-- populated by JS --></div>
  </div>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-email" id="user-email">—</div>
        <div class="user-role"  id="user-role">—</div>
      </div>
      <button class="logout-btn" onclick="logout()">exit</button>
    </div>
  </div>
</aside>

<!-- ── Main ── -->
<main class="main">
  <div class="chat-header">
    <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6"  x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="header-title" id="header-title" onclick="startRenameHeader()">New conversation</div>
    <div class="status-pill idle" id="status-pill">ready</div>
  </div>

  <div class="messages" id="messages">
    <!-- empty state shown by JS -->
  </div>

  <div class="input-area">
    <div class="input-wrap" id="input-wrap">
      <textarea id="msg-input" placeholder="Ask anything about your data…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send (⌘↵)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="input-hint">⌘ Enter to send · Shift+Enter for new line</div>
  </div>
</main>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let token      = null;
let currentUser = null;
let sessions   = [];
let activeSessionId = null;
let isStreaming = false;

// ── Boot ──────────────────────────────────────────────────────────────────────
(async function boot() {
  token = localStorage.getItem('vanna_token');
  if (!token) { window.location.href = '/login'; return; }

  currentUser = JSON.parse(localStorage.getItem('vanna_user') || '{}');
  renderUserInfo();

  await loadSessions();

  // auto-select first session or create new one
  if (sessions.length > 0) {
    await selectSession(sessions[0].session_id);
  } else {
    showEmptyState();
  }
})();

// ── User info ─────────────────────────────────────────────────────────────────
function renderUserInfo() {
  const email = currentUser.email || '—';
  const role  = localStorage.getItem('vanna_role') || 'user';
  document.getElementById('user-email').textContent = email;
  document.getElementById('user-role').textContent  = role;
  document.getElementById('user-avatar').textContent =
    email.charAt(0).toUpperCase() || '?';
}

function logout() {
  localStorage.removeItem('vanna_token');
  localStorage.removeItem('vanna_user');
  localStorage.removeItem('vanna_role');
  window.location.href = '/login';
}

// ── Sidebar toggle ─────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ── Sessions API ──────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (res.status === 401) { logout(); return null; }
  return res.ok ? res.json() : null;
}

async function loadSessions() {
  const data = await api('GET', '/api/sessions?limit=100');
  sessions = data?.sessions || [];
  renderSessionList();
}

async function newSession() {
  const data = await api('POST', '/api/sessions');
  if (!data) return;
  sessions.unshift(data);
  renderSessionList();
  await selectSession(data.session_id);
}

async function selectSession(id) {
  activeSessionId = id;
  renderSessionList();

  // load history
  const data = await api('GET', `/api/sessions/${id}`);
  if (!data) {
    // API failed or session not found — show empty state so UI isn't blank
    showEmptyState();
    document.getElementById('header-title').textContent = 'New conversation';
    console.error('selectSession: failed to load session', id);
    return;
  }

  // update header title
  const title = data.title || data.preview?.slice(0, 60) || 'New conversation';
  document.getElementById('header-title').textContent = title;

  renderHistory(data.messages || []);
}

async function renameSession(id, title) {
  await api('PATCH', `/api/sessions/${id}`, { title });
  const s = sessions.find(s => s.session_id === id);
  if (s) s.title = title;
  renderSessionList();
  if (id === activeSessionId) {
    document.getElementById('header-title').textContent = title;
  }
}

async function deleteSession(id) {
  await api('DELETE', `/api/sessions/${id}`);
  sessions = sessions.filter(s => s.session_id !== id);
  renderSessionList();
  if (id === activeSessionId) {
    activeSessionId = null;
    if (sessions.length > 0) {
      await selectSession(sessions[0].session_id);
    } else {
      showEmptyState();
      document.getElementById('header-title').textContent = 'New conversation';
    }
  }
}

// ── Render sidebar ────────────────────────────────────────────────────────────
function renderSessionList() {
  const el = document.getElementById('session-list');

  if (sessions.length === 0) {
    el.innerHTML = `<div style="padding:12px 10px;font-size:.75rem;color:var(--muted);font-family:'DM Mono',monospace;">No conversations yet</div>`;
    return;
  }

  el.innerHTML = sessions.map(s => {
    const isActive = s.session_id === activeSessionId;
    const title    = s.title || s.preview?.slice(0, 48) || 'New conversation';
    const preview  = s.preview || '—';
    const time     = relativeTime(s.updated_at);
    return `
      <div class="session-item ${isActive ? 'active' : ''}"
           onclick="selectSession('${s.session_id}')"
           data-id="${s.session_id}">
        <div class="session-body">
          <div class="session-title-text" id="stitle-${s.session_id}">${esc(title)}</div>
          <div class="session-preview">${esc(preview.slice(0, 60))}</div>
          <div class="session-time">${time}</div>
        </div>
        <div class="session-actions">
          <button class="sess-act-btn" title="Rename"
            onclick="event.stopPropagation(); startRename('${s.session_id}')">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="sess-act-btn del" title="Delete"
            onclick="event.stopPropagation(); confirmDelete('${s.session_id}')">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
            </svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

function startRename(id) {
  const titleEl = document.getElementById(`stitle-${id}`);
  if (!titleEl) return;
  const current = sessions.find(s => s.session_id === id)?.title ||
                  sessions.find(s => s.session_id === id)?.preview || '';
  titleEl.innerHTML = '';
  const inp = document.createElement('input');
  inp.className = 'rename-input';
  inp.value = current;
  inp.onclick = e => e.stopPropagation();
  inp.onkeydown = e => {
    if (e.key === 'Enter')  { renameSession(id, inp.value.trim()); }
    if (e.key === 'Escape') { renderSessionList(); }
  };
  inp.onblur = () => { if (inp.value.trim()) renameSession(id, inp.value.trim()); else renderSessionList(); };
  titleEl.appendChild(inp);
  inp.focus(); inp.select();
}

function startRenameHeader() {
  if (!activeSessionId) return;
  const el = document.getElementById('header-title');
  const current = el.textContent;
  const inp = document.createElement('input');
  inp.className = 'header-title editing';
  inp.value = current;
  el.replaceWith(inp);
  inp.focus(); inp.select();
  const finish = () => {
    const val = inp.value.trim() || current;
    const newEl = document.createElement('div');
    newEl.className = 'header-title';
    newEl.id = 'header-title';
    newEl.textContent = val;
    newEl.onclick = startRenameHeader;
    inp.replaceWith(newEl);
    renameSession(activeSessionId, val);
  };
  inp.onblur = finish;
  inp.onkeydown = e => { if (e.key === 'Enter') { inp.blur(); } if (e.key === 'Escape') { inp.value = current; inp.blur(); } };
}

function confirmDelete(id) {
  if (confirm('Delete this conversation?')) deleteSession(id);
}

// ── Render history ─────────────────────────────────────────────────────────────
function renderHistory(messages) {
  const el = document.getElementById('messages');
  // Filter out any messages with no visible content before deciding to show empty state
  const visible = messages.filter(m => (m.content || '').trim());
  if (visible.length === 0) { showEmptyState(); return; }

  el.innerHTML = '';
  visible.forEach(m => {
    const ts = m.timestamp ? new Date(m.timestamp) : new Date();
    if (m.role === 'user') {
      appendUserMessage(m.content, ts);
    } else if (m.role === 'assistant') {
      const row = appendAssistantRow(/* showSummaryLabel= */ true);
      const bubble = row.querySelector('.ai-bubble');
      bubble.innerHTML = renderMarkdown(m.content);
      addTimestamp(row, ts);
    }
  });
  scrollToBottom();
}

// ── Chat send ─────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || isStreaming) return;

  // Ensure we have a session
  if (!activeSessionId) {
    const data = await api('POST', '/api/sessions');
    if (!data) return;
    sessions.unshift(data);
    renderSessionList();
    activeSessionId = data.session_id;
  }

  // Clear empty state if shown
  const msgs = document.getElementById('messages');
  const empty = msgs.querySelector('.empty-state');
  if (empty) msgs.removeChild(empty);

  input.value = '';
  autoResize(input);
  appendUserMessage(text);

  setInputDisabled(true);
  isStreaming = true;
  setStatus('working', 'thinking…');

  // Insert chat loader card (replaces old typing indicator)
  const loaderRow = appendChatLoader();

  // Create the assistant row (created lazily on first text chunk)
  let assistantRow  = null;
  let currentBubble = null;
  let accText       = '';
  let loaderRemoved = false;

  function removeLoader() {
    if (!loaderRemoved && loaderRow.parentNode) {
      loaderRow.parentNode.removeChild(loaderRow);
      loaderRemoved = true;
    }
  }

  // Update session preview in sidebar
  const s = sessions.find(s => s.session_id === activeSessionId);
  if (s && !s.preview) {
    s.preview = text;
    renderSessionList();
  }

  const ctx = {
    getOrCreateAssistantRow: () => {
      removeLoader();
      if (!assistantRow) {
        assistantRow  = appendAssistantRow();
        currentBubble = assistantRow.querySelector('.ai-bubble');
      }
      return { row: assistantRow, bubble: currentBubble };
    },
    appendText: txt => {
      if (!loaderRemoved) {
        removeLoader();
        assistantRow  = appendAssistantRow(/* showSummaryLabel= */ true);
        currentBubble = assistantRow.querySelector('.ai-bubble');
      } else if (!assistantRow) {
        assistantRow  = appendAssistantRow(true);
        currentBubble = assistantRow.querySelector('.ai-bubble');
      }
      accText += txt;
      currentBubble.innerHTML = renderMarkdown(accText);
    },
    resetText: () => { accText = ''; },
    updateLoaderStep: stepText => {
      if (!loaderRemoved) updateChatLoaderStep(loaderRow, stepText);
    },
  };

  try {
    const res = await fetch('/api/vanna/v2/chat_poll', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({
        message:         text,
        conversation_id: activeSessionId,
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const chunks = data.chunks || [];

    removeLoader();

    // ── 1. Collect all text fragments into one final summary ─────────────────
    const finalText = chunks
      .filter(c => c.rich?.type === 'text')
      .map(c => c.rich?.data?.content || c.rich?.data?.text || '')
      .join('');

    if (finalText.trim()) {
      assistantRow  = appendAssistantRow(/* showSummaryLabel= */ true);
      currentBubble = assistantRow.querySelector('.ai-bubble');
      currentBubble.innerHTML = renderMarkdown(finalText);
    }

    // ── 2. Show meaningful data — skip schema / introspection tables ──────────
    // Column names that only appear in internal schema-lookup queries
    const SCHEMA_COLS = new Set([
      'column_name','data_type','table_name','table_schema','table_catalog',
      'column_default','is_nullable','udt_name','character_maximum_length',
      'numeric_precision','ordinal_position',
    ]);

    function isSchemaDataframe(rich) {
      const cols = (rich.data?.columns || []).map(c => String(c).toLowerCase());
      return cols.length > 0 && cols.every(c => SCHEMA_COLS.has(c));
    }

    for (const chunk of chunks) {
      const rich = chunk.rich;
      if (!rich) continue;
      // Skip schema-only dataframes (internal DB introspection)
      if (rich.type === 'dataframe' && isSchemaDataframe(rich)) continue;
      // Render real data tables, charts, and error notifications
      if (['dataframe', 'chart', 'notification'].includes(rich.type)) {
        processChunk(chunk, ctx);
      }
    }

    scrollToBottom();

  } catch (err) {
    removeLoader();
    appendNotification('error', 'Connection error: ' + err.message);
  }

  // Auto-set title from first message if no title set
  const activeS = sessions.find(s => s.session_id === activeSessionId);
  if (activeS && !activeS.title) {
    const firstTitle = text.slice(0, 60);
    await renameSession(activeSessionId, firstTitle);
  }

  setInputDisabled(false);
  setStatus('idle', 'ready');
  isStreaming = false;
  scrollToBottom();
}

// ── Chunk processor ───────────────────────────────────────────────────────────
function processChunk(chunk, ctx) {
  const rich = chunk.rich;
  if (!rich) return;

  const type      = rich.type;
  const lifecycle = rich.lifecycle || 'create';
  const data      = rich.data || {};

  switch (type) {
    // ── Text / markdown ──────────────────────────────────────────────────────
    case 'text': {
      const content = data.content || data.text || '';
      if (!content) break;
      if (lifecycle === 'create') {
        ctx.resetText();
        ctx.appendText(content);
      } else {
        ctx.appendText(content);
      }
      break;
    }

    // ── DataFrame table ──────────────────────────────────────────────────────
    case 'dataframe': {
      const rows    = data.data || data.rows || [];
      const columns = data.columns || (rows[0] ? Object.keys(rows[0]) : []);
      if (!rows.length) break;
      const { row } = ctx.getOrCreateAssistantRow();
      const wrap = row.querySelector('.msg-bubble-wrap');
      wrap.appendChild(buildDataTable(columns, rows, data.title));
      scrollToBottom();
      break;
    }

    // ── Chart ────────────────────────────────────────────────────────────────
    case 'chart': {
      const plotlyData = data.data;
      if (!plotlyData) break;
      const { row } = ctx.getOrCreateAssistantRow();
      const wrap = row.querySelector('.msg-bubble-wrap');
      const chartWrap = document.createElement('div');
      chartWrap.className = 'chart-wrap';
      const chartDiv = document.createElement('div');
      chartDiv.style.cssText = 'width:100%;height:320px;';
      chartWrap.appendChild(chartDiv);
      wrap.appendChild(chartWrap);

      const plotData   = plotlyData.data   || [];
      const plotLayout = plotlyData.layout || {};
      // Light theme
      plotLayout.paper_bgcolor = '#ffffff';
      plotLayout.plot_bgcolor  = '#ffffff';
      plotLayout.font          = { color: '#5e5d7a', family: 'DM Sans' };
      if (plotLayout.xaxis) plotLayout.xaxis.gridcolor = '#e4e3f0';
      if (plotLayout.yaxis) plotLayout.yaxis.gridcolor = '#e4e3f0';
      plotLayout.margin        = plotLayout.margin || { t: 40, r: 20, b: 40, l: 50 };

      requestAnimationFrame(() => {
        Plotly.newPlot(chartDiv, plotData, plotLayout, { responsive: true, displaylogo: false });
      });
      scrollToBottom();
      break;
    }

    // ── Notification banner ──────────────────────────────────────────────────
    case 'notification': {
      const { row } = ctx.getOrCreateAssistantRow();
      const wrap = row.querySelector('.msg-bubble-wrap');
      const b = document.createElement('div');
      b.className = `notif-banner ${data.level || 'info'}`;
      b.textContent = data.message || '';
      wrap.appendChild(b);
      scrollToBottom();
      break;
    }

    // ── Tool status card ─────────────────────────────────────────────────────
    case 'status_card': {
      const { row } = ctx.getOrCreateAssistantRow();
      const wrap = row.querySelector('.msg-bubble-wrap');
      const status = data.status || 'running';
      const card   = document.createElement('div');
      const dotCls = status === 'success' ? 'success'
                   : status === 'error'   ? 'error' : 'running';
      card.className = `tool-card ${dotCls}`;
      card.id = `card-${rich.id}`;
      card.innerHTML = `
        <div class="tool-dot ${dotCls}"></div>
        <span class="tool-name">${esc(data.title || data.icon || '')}</span>
        <span class="tool-desc">${esc(data.description || '')}</span>`;
      wrap.appendChild(card);
      scrollToBottom();
      break;
    }

    // ── Task tracker update ──────────────────────────────────────────────────
    case 'task_tracker_update': {
      // Silently track — only show tasks with running state as a small pill
      const task   = data.task || {};
      const taskId = data.task_id || task.id;
      const op     = data.operation || lifecycle;
      if (op === 'add_task' || op === 'create') {
        const { row } = ctx.getOrCreateAssistantRow();
        const wrap = row.querySelector('.msg-bubble-wrap');
        const pill = document.createElement('div');
        pill.className = 'tool-card running';
        pill.id = `task-${taskId}`;
        pill.innerHTML = `
          <div class="tool-dot running"></div>
          <span class="tool-name">${esc(task.title || 'Task')}</span>`;
        wrap.appendChild(pill);
      } else if (op === 'update_task' || op === 'update') {
        const el = document.getElementById(`task-${taskId}`);
        if (el) {
          const newStatus = data.status || task?.status || 'completed';
          el.className = `tool-card ${newStatus === 'completed' ? 'success' : newStatus === 'error' ? 'error' : 'running'}`;
          const dot = el.querySelector('.tool-dot');
          if (dot) dot.className = `tool-dot ${newStatus === 'completed' ? 'success' : newStatus === 'error' ? 'error' : 'running'}`;
        }
      }
      scrollToBottom();
      break;
    }

    // ── Status bar / chat input updates ─────────────────────────────────────
    case 'status_bar_update': {
      const s = data.status || 'idle';
      const m = data.message || '';
      setStatus(s, m);
      // Also push the step text into the loader card while it's visible
      if (m && ctx.updateLoaderStep) ctx.updateLoaderStep(m);
      break;
    }
    case 'chat_input_update': {
      if (data.disabled === false) {
        // stream is done — but we handle this after the loop, ignore here
      }
      if (data.placeholder) {
        document.getElementById('msg-input').placeholder = data.placeholder;
      }
      break;
    }
  }
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function appendUserMessage(text, ts) {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'msg-row user';
  const initials = (currentUser?.email || 'U').charAt(0).toUpperCase();
  row.innerHTML = `
    <div class="msg-avatar user-av">${esc(initials)}</div>
    <div class="msg-bubble-wrap">
      <div class="msg-bubble user-bubble">${esc(text).replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${formatTime(ts || new Date())}</div>
    </div>`;
  msgs.appendChild(row);
  scrollToBottom();
}

function appendAssistantRow(showSummaryLabel = false) {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'msg-row';
  const labelHtml = showSummaryLabel
    ? `<div class="summary-label">
         <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
           <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
         </svg>
         Response
       </div>`
    : '';
  row.innerHTML = `
    <div class="msg-avatar ai-av">🧠</div>
    <div class="msg-bubble-wrap">
      ${labelHtml}
      <div class="msg-bubble ai-bubble"></div>
    </div>`;
  msgs.appendChild(row);
  scrollToBottom();
  return row;
}

function appendChatLoader() {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar ai-av">🧠</div>
    <div class="msg-bubble-wrap">
      <div class="chat-loader">
        <div class="loader-top">
          <div class="loader-ring"></div>
          <span class="loader-step" id="loader-step-text">Thinking…</span>
        </div>
        <div class="loader-dots">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>`;
  msgs.appendChild(row);
  scrollToBottom();
  return row;
}

function updateChatLoaderStep(loaderRow, text) {
  const el = loaderRow.querySelector('.loader-step');
  if (el) el.textContent = text;
}

function appendTypingRow() {
  // kept as fallback — appendChatLoader() is used instead
  return appendChatLoader();
}

function appendNotification(level, message) {
  const msgs = document.getElementById('messages');
  const row  = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="msg-avatar ai-av">🧠</div>
    <div class="msg-bubble-wrap">
      <div class="notif-banner ${level}">${esc(message)}</div>
    </div>`;
  msgs.appendChild(row);
  scrollToBottom();
}

function addTimestamp(row, ts) {
  const wrap = row.querySelector('.msg-bubble-wrap');
  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = formatTime(ts);
  wrap.appendChild(t);
}

function buildDataTable(columns, rows, title) {
  const wrap = document.createElement('div');
  wrap.className = 'df-wrap';
  const header = columns.map(c => `<th>${esc(String(c))}</th>`).join('');
  const body   = rows.map(r =>
    `<tr>${columns.map(c => `<td>${esc(r[c] == null ? '' : String(r[c]))}</td>`).join('')}</tr>`
  ).join('');
  wrap.innerHTML = `
    <table class="df-table">
      <thead><tr>${header}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="df-row-count">${rows.length.toLocaleString()} row${rows.length !== 1 ? 's' : ''}</div>`;
  if (title) {
    const t = document.createElement('div');
    t.style.cssText = 'padding:6px 10px;font-size:.7rem;font-family:"DM Mono",monospace;color:var(--muted2);border-bottom:1px solid var(--border)';
    t.textContent = title;
    wrap.insertBefore(t, wrap.firstChild);
  }
  return wrap;
}

function showEmptyState() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🧠</div>
      <h2>What would you like to know?</h2>
      <p>Ask a question in plain English — I'll write the SQL, run it, and visualise the results.</p>
      <!-- <div class="suggestions">
        <button class="suggestion-btn" onclick="useSuggestion(this)">Show total revenue by month this year</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">Which products have the highest return rate?</button>
        <button class="suggestion-btn" onclick="useSuggestion(this)">Compare sales by region for last quarter</button>
      </div> -->
    </div>`;
}

function useSuggestion(btn) {
  const input = document.getElementById('msg-input');
  input.value = btn.textContent;
  input.focus();
  autoResize(input);
}

// ── UI state ──────────────────────────────────────────────────────────────────
function setStatus(status, message) {
  const pill = document.getElementById('status-pill');
  pill.className = `status-pill ${status}`;
  pill.textContent = message || status;
}

function setInputDisabled(disabled) {
  document.getElementById('input-wrap').classList.toggle('disabled', disabled);
  document.getElementById('send-btn').disabled = disabled;
  document.getElementById('msg-input').disabled = disabled;
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

// ── Textarea auto-resize ──────────────────────────────────────────────────────
const textarea = document.getElementById('msg-input');
textarea.addEventListener('input', () => autoResize(textarea));
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
textarea.addEventListener('keydown', e => {
  const isMac   = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
  const modKey  = isMac ? e.metaKey : e.ctrlKey;
  if (e.key === 'Enter' && modKey) { e.preventDefault(); sendMessage(); }
  if (e.key === 'Enter' && !e.shiftKey && !modKey) { e.preventDefault(); sendMessage(); }
});

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderMarkdown(text) {
  if (!text) return '';
  try {
    return marked.parse(text, { breaks: true, gfm: true });
  } catch {
    return esc(text).replace(/\n/g, '<br>');
  }
}

function formatTime(d) {
  if (!d) return '';
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function relativeTime(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}
